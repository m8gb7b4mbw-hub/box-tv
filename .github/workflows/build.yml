name: Construire l'appli Box TV

on:
  push:
    branches: [main]
    paths-ignore: ['cleanyourtv-launcher/**', '.github/workflows/launcher.yml', 'mon-nas/**', '.github/workflows/nas.yml', 'cadre/**', '.github/workflows/cadre.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clé de signature (secret GitHub)
        env:
          KS: ${{ secrets.BOXTV_KEYSTORE_B64 }}
        run: |
          [ -n "$KS" ] || { echo "Secret BOXTV_KEYSTORE_B64 manquant"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/boxtv.p12"
          echo "BOXTV_KEYSTORE=$RUNNER_TEMP/boxtv.p12" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        env:
          BOXTV_KEYSTORE_PASSWORD: ${{ secrets.BOXTV_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk box-tv.apk

      - name: Publier (lien fixe pour Downloader)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Box TV v${{ github.run_number }}
          files: box-tv.apk
          make_latest: true

name: Construire le launcher CleanYourTV

on:
  push:
    branches: [main]
    paths: ['cleanyourtv-launcher/**', '.github/workflows/launcher.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Clé de signature (secret GitHub)
        env:
          KS: ${{ secrets.BOXTV_KEYSTORE_B64 }}
        run: |
          [ -n "$KS" ] || { echo "Secret BOXTV_KEYSTORE_B64 manquant"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/boxtv.p12"
          echo "BOXTV_KEYSTORE=$RUNNER_TEMP/boxtv.p12" >> "$GITHUB_ENV"
      - name: Compiler
        working-directory: cleanyourtv-launcher
        env:
          BOXTV_KEYSTORE_PASSWORD: ${{ secrets.BOXTV_KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q --console=plain
          cp app/build/outputs/apk/release/app-release.apk ../tvhome.apk
      - name: Publier sous un lien fixe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete launcher --yes --cleanup-tag || true
          gh release create launcher tvhome.apk --title "Launcher CleanYourTV (build ${{ github.run_number }})" --notes "Compilé depuis cleanyourtv-launcher/" --latest=false

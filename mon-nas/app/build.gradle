plugins {
    id 'com.android.application'
}

// « Mon NAS » : petite appli qui ouvre la page Mon NAS du serveur (dossiers, photos, vidéos).
android {
    namespace 'fr.boxtv.nas'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.boxtv.nas'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Clé de signature SECRÈTE : fournie par la recette GitHub (secrets BOXTV_KEYSTORE_B64 / BOXTV_KEYSTORE_PASSWORD).
    // Sans elle, l'APK « release » n'est pas signé et la recette s'arrête (aucun APK signé avec une mauvaise clé).
    def releaseKeystore = System.getenv('BOXTV_KEYSTORE')
    signingConfigs {
        boxtv {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storeType 'pkcs12'
                storePassword System.getenv('BOXTV_KEYSTORE_PASSWORD')
                keyAlias 'boxtv'
                keyPassword System.getenv('BOXTV_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.boxtv : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

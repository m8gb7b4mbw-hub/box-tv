<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Box TV</title>
<style>
/* 1rem = 1/96 de la largeur de l'écran : même rendu sur toutes les télés */
html{font-size:calc(100vw / 96);background:#0b0b0d}
*{box-sizing:border-box;margin:0}
body{color:#f5f5f7;font-family:Inter,-apple-system,"SF Pro Display",Roboto,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden;
 background:radial-gradient(120rem 60rem at 80% -20%,#1a2233 0%,#0b0b0d 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus{outline:none}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
main{padding:4rem 6rem 3rem;display:flex;flex-direction:column;gap:3.4rem}
header{display:flex;justify-content:space-between;align-items:flex-end}
#date{font-size:1.4rem;color:#a1a1a6;font-weight:500}
#clock{font-size:4.4rem;font-weight:600;letter-spacing:-.1rem;line-height:1.05}
.chips{display:flex;gap:1rem}
.chip{display:flex;align-items:center;gap:.7rem;padding:.8rem 1.4rem;border-radius:99rem;background:#ffffff14;font-size:1.25rem;font-weight:500}
.chip svg{width:1.6rem;height:1.6rem}
.dot{width:.8rem;height:.8rem;border-radius:50%;background:#30d158}
.dot.off{background:#ff9f0a}
.chip.tip{background:#ff9f0a;color:#000;font-weight:600}
.chip.tip:focus{background:#fff;box-shadow:0 0 0 .3rem #ff9f0a}
h2{font-size:1.7rem;font-weight:600;color:#a1a1a6;margin-bottom:1.6rem}
/* tuiles des applis */
.apps{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:2rem;align-items:start}
.app{display:flex;flex-direction:column;align-items:center;gap:1rem}
.app .ic{width:100%;aspect-ratio:16/10;border-radius:1.5rem;background:#1c1c1e;display:grid;place-items:center;transition:transform .18s,box-shadow .18s,background .18s}
.app .ic svg{width:38%;height:38%}
.app span{font-size:1.25rem;font-weight:500;color:#a1a1a6;transition:color .18s,transform .18s;text-align:center}
.app:focus .ic{transform:scale(1.12);background:var(--acc,#0a84ff);box-shadow:0 0 0 .3rem #fff,0 2rem 4rem #000b}
.app:focus span{color:#fff;transform:translateY(.6rem)}
.app.miss .ic{opacity:.45}
/* affiches */
.row{display:flex;gap:1.8rem;overflow-x:auto;scrollbar-width:none;padding:1.2rem .4rem 2rem;margin:-1.2rem -.4rem 0;scroll-behavior:smooth}
.row::-webkit-scrollbar{display:none}
.pc{flex:0 0 auto;width:11rem;display:flex;flex-direction:column;gap:.8rem;text-align:left}
.pc .ph{width:100%;height:16.5rem;border-radius:1.1rem;background:#1c1c1e center/cover;transition:transform .18s,box-shadow .18s;position:relative;overflow:hidden}
.pc .ph em{position:absolute;inset:0;display:flex;align-items:flex-end;padding:.8rem;font-style:normal;font-weight:700;font-size:1.05rem}
.pc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc b{font-size:1.1rem;font-weight:500;color:#d1d1d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .18s}
.pc:focus .ph{transform:scale(1.1);box-shadow:0 0 0 .3rem #fff,0 1.6rem 3rem #000c}
.pc:focus b{color:#fff;transform:translateY(.7rem)}
.pc.rc{width:20rem}
.pc.rc .ph{height:11.25rem}
.bar{height:.35rem;border-radius:.3rem;background:#ffffff30;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc,#0a84ff)}
.empty{color:#8e8e93;font-size:1.2rem;padding:1rem 0}
footer{display:flex;gap:3rem;font-size:1.15rem;color:#8e8e93}
footer b{color:#d1d1d6;font-weight:600}
/* toutes les applis */
#all{position:fixed;inset:0;background:#0b0b0dF2;display:none;overflow-y:auto;padding:4rem 6rem}
#all.on{display:block}
#all h1{font-size:3rem;margin-bottom:2.4rem}
#allg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2.4rem 2rem}
#allg .app .ic{background:#1c1c1e center/contain no-repeat}
#allg .app .ic img{width:100%;height:100%;object-fit:contain;border-radius:1.5rem}
#toast{position:fixed;left:50%;bottom:3rem;transform:translateX(-50%) translateY(2rem);background:#2c2c2eF0;padding:1.1rem 2rem;border-radius:2rem;font-size:1.3rem;font-weight:500;opacity:0;transition:.3s;pointer-events:none;max-width:70%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
</style></head><body>
<main>
 <header>
  <div><p id="date"></p><p id="clock"></p></div>
  <div class="chips">
   <button class="chip tip" id="tip" hidden>Démarrer la box sur Box TV : activer</button>
   <div class="chip"><i class="dot off" id="nasdot"></i><span id="nas">NAS…</span></div>
  </div>
 </header>

 <section><h2>Applications</h2><div class="apps" id="apps"></div></section>
 <section id="resume" hidden><h2>Reprendre la lecture</h2><div class="row" id="resrow"></div></section>
 <section><h2>Nouveaux films sur ton IPTV</h2><div class="row" id="films"><p class="empty">Chargement…</p></div></section>

 <footer>
  <span><b>Ctrl+1</b> IPTV</span><span><b>Ctrl+Y</b> YouTube</span><span><b>Ctrl+B</b> Chrome</span><span><b>Ctrl+T</b> Terminal</span><span><b>Ctrl+K</b> Claude</span>
 </footer>
</main>
<div id="all"><h1>Toutes les applis</h1><div id="allg"></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const B=window.BoxTV||null;               // pont vers l'appli Android (absent dans un navigateur)
const HOST=location.hostname;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)};
const px=u=>u?'/proxy?url='+encodeURIComponent(u):'';

/* ---------- icônes ---------- */
const S=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const IC={
 iptv:S('<rect x="2.5" y="5" width="19" height="12.5" rx="2"/><path d="M8 21h8"/><path d="M10.5 9.2v4.8l4-2.4z" fill="currentColor"/>'),
 yt:S('<rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/><path d="M10 9.3v5.4l4.6-2.7z" fill="currentColor"/>'),
 chrome:S('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 8.5h8.2M8.9 13.8L4.8 6.6M15 13.8l-4.1 7.1"/>'),
 term:S('<rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M7 9.5l3 2.5-3 2.5"/><path d="M12.5 15h4.5"/>'),
 claude:S('<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 3.5V17A2.5 2.5 0 0 1 4 14.5z"/><path d="M9 10.5h6"/>'),
 work:S('<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/>'),
 films:S('<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
 settings:S('<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>'),
 all:S('<rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/>')
};

/* ---------- les applis de l'accueil (modifiable ici) ---------- */
const APPS=[
 {id:'iptv',label:'IPTV',go:'/?tv=1',key:'1'},
 {id:'yt',label:'YouTube',pkgs:['com.teamsmart.videomanager.tv','com.google.android.youtube.tv','com.google.android.youtube'],key:'y',
  miss:'Installe SmartTube avec Downloader : github.com/yuliskov/SmartTube'},
 {id:'chrome',label:'Chrome',pkgs:['com.android.chrome','com.chrome.beta','com.phlox.tvwebbrowser','org.mozilla.firefox'],key:'b',
  miss:'Installe Chrome (APK via Downloader) ou TV Bro depuis le Play Store'},
 {id:'term',label:'Terminal',pkgs:['com.termux'],key:'t',miss:'Installe Termux avec Downloader (github.com/termux/termux-app)'},
 {id:'claude',label:'Claude',pkgs:['com.anthropic.claude'],url:'https://claude.ai',key:'k'},
 {id:'work',label:'Poste de travail',web:'http://'+HOST+':8443',key:'w'},
 {id:'films',label:'Mes films',go:'/?tv=1&dls=1',key:'f'},
 {id:'settings',label:'Réglages',act:()=>B?B.settings():toast('Disponible dans l\'appli Box TV')},
 {id:'all',label:'Toutes les applis',act:()=>openAll()}
];
const firstInstalled=a=>B&&a.pkgs?a.pkgs.find(p=>{try{return B.installed(p)}catch{return false}}):null;

$('#apps').innerHTML=APPS.map(a=>`<button class="app${a.pkgs&&B&&!firstInstalled(a)?' miss':''}" data-app="${a.id}"><div class="ic">${IC[a.id]}</div><span>${esc(a.label)}</span></button>`).join('');

async function launch(id){
 const a=APPS.find(x=>x.id===id);if(!a)return;
 if(a.act)return a.act();
 if(a.go){location.href=a.go;return}
 if(a.web){ // code-server : on vérifie qu'il répond
  try{await fetch(a.web,{mode:'no-cors',signal:AbortSignal.timeout(2500)});location.href=a.web}
  catch{toast('Poste de travail pas encore installé sur le NAS (code-server)')}return}
 if(a.pkgs){
  const p=firstInstalled(a);
  if(p&&B.launch(p))return;
  if(a.url){B?B.openUrl(a.url):window.open(a.url);return}
  if(!B){location.href='intent:#Intent;package='+a.pkgs[0]+';end';return}
  toast(a.miss||a.label+' n\'est pas installé')}}

/* ---------- toutes les applis ---------- */
function openAll(){
 if(!B){toast('Disponible dans l\'appli Box TV');return}
 let list=[];try{list=JSON.parse(B.apps())}catch{}
 list.sort((x,y)=>x.label.localeCompare(y.label,'fr'));
 $('#allg').innerHTML=list.map(a=>`<button class="app" data-pkg="${esc(a.pkg)}"><div class="ic" data-ico="${esc(a.pkg)}"></div><span>${esc(a.label)}</span></button>`).join('');
 $('#all').classList.add('on');$('#all').scrollTop=0;
 const first=$('#allg .app');first&&focusEl(first,false);
 // icônes chargées petit à petit pour rester fluide
 const ics=$$('[data-ico]');let i=0;const step=()=>{for(let n=0;n<4&&i<ics.length;n++,i++){const src=B.icon(ics[i].dataset.ico);if(src)ics[i].innerHTML=`<img src="${src}" alt="">`}if(i<ics.length)setTimeout(step,16)};step()}
function closeAll(){$('#all').classList.remove('on');const t=$('[data-app="all"]');t&&focusEl(t,false)}
window.boxBack=()=>{if($('#all').classList.contains('on')){closeAll();return true}return false};

/* ---------- démarrage direct sur Box TV (accessibilité) ---------- */
try{if(B&&B.watcher&&!B.watcher()){const t=$('#tip');t.hidden=false;t.onclick=()=>{toast('Active « Box TV : remplacer l\'accueil » puis reviens');B.accessibility()}}}catch{}

/* ---------- heure ---------- */
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
 const s=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});$('#date').textContent=s[0].toUpperCase()+s.slice(1)}
tick();setInterval(tick,10000);

/* ---------- état du NAS ---------- */
const fmtSize=b=>b>=1099511627776?(b/1099511627776).toFixed(1).replace('.',',')+' To':(b/1073741824).toFixed(0)+' Go';
async function nas(){
 try{const r=await fetch('/api/disk');if(r.ok){const d=await r.json();if(d.total){$('#nas').textContent='NAS · '+fmtSize(d.free)+' libres';$('#nasdot').classList.remove('off');return}}}catch{}
 try{const r=await fetch('/api/config');if(r.ok){$('#nas').textContent='NAS en ligne';$('#nasdot').classList.remove('off');return}}catch{}
 $('#nas').textContent='NAS injoignable'}
nas();setInterval(nas,60000);

/* ---------- reprendre + nouveaux films ---------- */
const clean=n=>{n=String(n||'');return n.replace(/^\s*[|\[(]?\s*[A-Z]{2,3}\s*[|\])]?\s*[-:–|]\s*/,'').replace(/\s+/g,' ').trim()||n};
const grad=t=>{let h=0;for(const c of String(t))h=(h*31+c.charCodeAt(0))%360;return`linear-gradient(160deg,hsl(${h} 55% 38%),hsl(${(h+50)%360} 55% 18%))`};
async function rows(){
 try{const st=await (await fetch('/api/state')).json();if(st.accent)document.documentElement.style.setProperty('--acc',st.accent);
  const pr=Object.values(st.prog||{}).filter(p=>p.d>0).sort((a,b)=>b.upd-a.upd).slice(0,10);
  if(pr.length){$('#resume').hidden=false;$('#resrow').innerHTML=pr.map(p=>`<button class="pc rc" data-resume="${esc(p.key)}"><div class="ph" style="background-image:${p.poster?`url(${px(p.poster)})`:grad(p.title)}"></div><div class="bar"><i style="width:${Math.round(p.t/p.d*100)}%"></i></div><b>${esc(p.title)}</b></button>`).join('')}}catch{}
 try{const r=await fetch('/api/x?action=get_vod_streams');const arr=await r.json();if(!Array.isArray(arr))throw 0;
  const seen=new Set(),list=arr.sort((a,b)=>(+b.added||0)-(+a.added||0)).filter(s=>{const k=clean(s.name).toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).slice(0,16);
  $('#films').innerHTML=list.map(s=>{const t=clean(s.name);return`<button class="pc" data-film="${esc(s.stream_id)}"><div class="ph" style="background-image:${grad(t)}"><em>${esc(t)}</em>${s.stream_icon?`<img loading="lazy" src="${px(s.stream_icon)}" alt="" onerror="this.remove()">`:''}</div><b>${esc(t)}</b></button>`}).join('')||'<p class="empty">Aucun film.</p>'}
 catch{$('#films').innerHTML='<p class="empty">Films indisponibles (vérifie les réglages de ton IPTV).</p>'}}
rows();

/* ---------- clics ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-app],[data-film],[data-resume],[data-pkg]');if(!t)return;const d=t.dataset;
 if(d.app)launch(d.app);
 else if(d.film)location.href='/?tv=1&film='+encodeURIComponent(d.film);
 else if(d.resume)location.href='/?tv=1&resume='+encodeURIComponent(d.resume);
 else if(d.pkg){if(!B.launch(d.pkg))toast('Impossible d\'ouvrir cette appli')}});

/* ---------- navigation à la télécommande ---------- */
const FOC='.app,.pc,#tip:not([hidden])';
const layer=()=>$('#all').classList.contains('on')?$('#all'):$('main');
const vis=e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0};
function focusEl(e,scroll=true){if(!e)return;e.focus({preventScroll:true});
 if(!scroll)return;if(e.closest('.apps')&&!e.closest('#all'))scrollTo({top:0,behavior:'smooth'});else e.scrollIntoView({block:'center',inline:'nearest',behavior:'smooth'})}
function pick(pool,r,dir){const cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
 for(const e of pool){const c=e.getBoundingClientRect(),ex=c.left+c.width/2,ey=c.top+c.height/2;let s;
  const ov=dir==='left'||dir==='right'?Math.min(r.bottom,c.bottom)-Math.max(r.top,c.top):Math.min(r.right,c.right)-Math.max(r.left,c.left);
  if(dir==='right'){if(!(ex>cx+2&&c.left>r.left+2))continue;s=Math.max(0,c.left-r.right)+(ov>0?0:Math.abs(ey-cy)*3)}
  else if(dir==='left'){if(!(ex<cx-2&&c.right<r.right-2))continue;s=Math.max(0,r.left-c.right)+(ov>0?0:Math.abs(ey-cy)*3)}
  else if(dir==='down'){if(!(ey>cy+2&&c.top>r.top+2))continue;s=Math.max(0,c.top-r.bottom)+Math.abs(ex-cx)*(ov>0?.3:1)}
  else{if(!(ey<cy-2&&c.bottom<r.bottom-2))continue;s=Math.max(0,r.top-c.bottom)+Math.abs(ex-cx)*(ov>0?.3:1)}
  if(s<bs){bs=s;best=e}}return best}
const DIR={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
document.addEventListener('keydown',e=>{
 const k=e.key;
 if(e.ctrlKey&&!e.altKey){const a=APPS.find(x=>x.key===k.toLowerCase());if(a){e.preventDefault();launch(a.id);return}}
 if(DIR[k]){e.preventDefault();const L=layer(),list=$$(FOC,L).filter(vis),a=document.activeElement;
  if(!list.includes(a)){focusEl(list[0],false);return}
  const t=pick(list.filter(x=>x!==a),a.getBoundingClientRect(),DIR[k]);if(t)focusEl(t);return}
 if(k==='Escape'||k==='Backspace'||k==='GoBack'){if(window.boxBack())e.preventDefault()}
});
// au démarrage et au retour sur l'accueil : focus sur l'IPTV (ou la dernière tuile utilisée)
const restore=()=>{const k=sessionStorage.getItem('boxtv-last');const t=(k&&$(`[data-app="${k}"]`))||$('.app');focusEl(t,false)};
document.addEventListener('focusin',e=>{const a=e.target.closest('[data-app]');if(a)sessionStorage.setItem('boxtv-last',a.dataset.app)});
addEventListener('pageshow',restore);restore();
</script>
</body></html>

<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon IPTV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/icon.png">
<title>Mon IPTV</title>
<style>
:root{--acc:#0a84ff;--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--fg:#fff;--mut:#8e8e93;--sep:#38383a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:var(--fg);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
svg .f{fill:currentColor;stroke:none}
#wrap{max-width:1500px;margin:0 auto}
/* barre du haut */
#top{display:flex;justify-content:flex-end;padding:calc(10px + env(safe-area-inset-top)) 16px 0;position:sticky;top:0;z-index:20;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:2px;padding:6px 10px;border-radius:30px;background:rgba(40,40,42,.72);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid #ffffff14}
.pill button{position:relative;width:44px;height:38px;font-size:23px;display:grid;place-items:center;border-radius:20px}
.pill button.on{color:var(--acc)}
.bdg{position:absolute;top:0;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
h1.lt{font-size:42px;font-weight:800;letter-spacing:-.5px;padding:2px 20px 14px}
h2.rt{font-size:23px;font-weight:700;letter-spacing:-.3px;padding:0 20px 10px;display:flex;align-items:center;gap:6px}
h2.rt button{color:var(--mut);font-size:20px;display:grid;place-items:center}
.sec{margin-bottom:26px}
/* héros */
.hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:12px;padding:0 16px}
.hero::-webkit-scrollbar{display:none}
.hc{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1.6;border-radius:26px;background:#1c1c1e center/cover;position:relative;overflow:hidden;cursor:pointer;max-height:560px}
.hc::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000d 0%,#0000 62%)}
.hc .t{position:absolute;left:24px;right:24px;bottom:20px;z-index:2}
.hc small{display:block;font-size:13px;letter-spacing:1.4px;font-weight:800;color:#ffffffb8;text-transform:uppercase}
.hc b{display:block;font-size:30px;line-height:1.1;margin:4px 0;text-shadow:0 2px 12px #0008}
.hc span{color:#ffffffc8;font-size:17px}
.dots{display:flex;justify-content:center;gap:8px;padding:14px 0 22px}
.dots i{width:8px;height:8px;border-radius:5px;background:#ffffff40;transition:.25s}.dots i.on{width:26px;background:#fff}
/* rangées & affiches */
.row{display:flex;gap:14px;overflow-x:auto;padding:0 20px;scrollbar-width:none;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{display:none}
.pc{flex:0 0 138px;cursor:pointer;scroll-snap-align:start;min-width:0}
.pc .ph{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:var(--g,#2c2c2e);box-shadow:0 6px 18px #0006;transition:transform .2s}
.pc:hover .ph{transform:scale(1.03)}
.pc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc .ph em{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10px;font-style:normal;font-weight:700;font-size:14px;line-height:1.15}
.pc .rt{position:absolute;top:8px;right:8px;background:#000a;backdrop-filter:blur(8px);border-radius:14px;padding:3px 9px 3px 7px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:3px;z-index:2}
.pc .rt svg{color:#fff}
.pc .fv{position:absolute;top:8px;left:8px;z-index:2;color:#ffd60a;font-size:18px}
.pc .nm{margin-top:8px;font-size:14px;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc .sb{color:var(--mut);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .pb,.rc .pb{height:4px;border-radius:3px;background:#ffffff35;margin-top:7px;overflow:hidden}
.pc .pb i,.rc .pb i{display:block;height:100%;background:var(--acc)}
.rc{flex:0 0 290px;cursor:pointer;scroll-snap-align:start}
.rc .ph{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#2c2c2e}
.rc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.rc .pl{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#000a;display:grid;place-items:center;font-size:24px;backdrop-filter:blur(6px)}
.rc .nm{margin-top:9px;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .sb{color:var(--mut);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:18px 14px;padding:0 20px}
.grid .pc{flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 20px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;background:var(--card);border-radius:20px;padding:8px 16px;color:#d1d1d6;font-size:14.5px;font-weight:600}
.chip.on{background:var(--acc);color:#fff}
/* chaînes */
.lv{padding:0 16px}
.ch{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:16px;cursor:pointer}
.ch:hover{background:var(--card)}
.ch .lg{flex:0 0 58px;height:58px;border-radius:14px;background:#2c2c2e;display:grid;place-items:center;overflow:hidden;font-weight:800;color:#8e8e93}
.ch .lg img{width:100%;height:100%;object-fit:contain;padding:5px}
.ch .in{flex:1;min-width:0}
.ch b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .ep{color:var(--mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.ch .pb{height:3px;border-radius:2px;background:#ffffff25;margin-top:5px;max-width:220px;overflow:hidden}.ch .pb i{display:block;height:100%;background:var(--acc)}
.ch .st{font-size:22px;color:#636366;padding:8px}.ch .st.on{color:#ffd60a}
/* barre d'onglets flottante */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 20px));z-index:30;display:flex;padding:7px;border-radius:38px;background:rgba(38,38,40,.78);backdrop-filter:blur(26px) saturate(1.8);-webkit-backdrop-filter:blur(26px) saturate(1.8);border:1px solid #ffffff18;box-shadow:0 12px 40px #000a}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border-radius:30px;font-size:11.5px;font-weight:600;color:#e5e5ea}
#tabs button svg{font-size:27px}
#tabs button.on{background:#ffffff1c;color:var(--acc)}
/* feuilles */
#sheet,#dls{position:fixed;inset:0;z-index:50;display:none;background:#000c;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow-y:auto;overscroll-behavior:contain}
#sheet.on,#dls.on{display:block}
.card{max-width:720px;margin:0 auto;min-height:100%;background:#111113;padding-bottom:60px}
@media(min-width:760px){.card{margin:30px auto;min-height:0;border-radius:28px;overflow:hidden}}
.bd{aspect-ratio:16/9;background:#1c1c1e center/cover;position:relative}
.bd::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#111113 0%,#0000 60%)}
.xb{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:3;width:38px;height:38px;border-radius:50%;background:#000a;backdrop-filter:blur(10px);display:grid;place-items:center;font-size:20px}
.dt{padding:0 22px;margin-top:-34px;position:relative;z-index:2}
.dt h2{font-size:30px;line-height:1.1;letter-spacing:-.4px}
.meta{color:var(--mut);margin:8px 0 14px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px 14px}
.meta .rate{color:#ffd60a;font-weight:700}
.btns{display:flex;gap:10px;margin-bottom:16px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:14px;font-weight:700;background:#2c2c2e;font-size:16px}
.btn.p{background:#fff;color:#000}.btn.sq{flex:0 0 52px}.btn.on{color:#ffd60a}
.btn:disabled{opacity:.5}
.plot{color:#d1d1d6;line-height:1.5;margin-bottom:14px}
.kv{color:var(--mut);font-size:14px;margin-bottom:6px}.kv b{color:#d1d1d6;font-weight:600}
.ep{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #2a2a2c}
.ep .th{flex:0 0 112px;aspect-ratio:16/9;border-radius:10px;background:#2c2c2e center/cover;position:relative}
.ep .it{flex:1;min-width:0;cursor:pointer}.ep .it b{display:block;font-size:15px}.ep .it small{color:var(--mut);display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep button{font-size:23px;padding:8px;color:var(--acc)}
.sub{padding:0 22px}
/* téléchargements */
.dl{background:#1c1c1e;border-radius:18px;padding:12px;margin:0 16px 10px;display:flex;gap:12px;align-items:center}
.dl .im{flex:0 0 52px;aspect-ratio:2/3;border-radius:9px;background:#2c2c2e center/cover}
.dl .in{flex:1;min-width:0}.dl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl small{display:block;color:var(--mut);font-size:12.5px;margin-top:3px;word-break:break-all}
.stor{margin:4px 0 14px;padding:14px 16px;background:var(--card2);border-radius:14px}.stor b{font-size:15px}.stor small{display:block;color:var(--mut);font-size:13px;margin-top:3px}.stor .sb{height:8px;border-radius:4px;background:#ffffff25;margin-top:10px;overflow:hidden}.stor .sb i{display:block;height:100%;background:var(--acc)}.dl .pb{height:5px;border-radius:3px;background:#ffffff25;margin-top:8px;overflow:hidden}.dl .pb i{display:block;height:100%;background:var(--acc);transition:width .4s}
.dl .ok{color:#32d74b}.dl .er{color:#ff453a}
.dl button{font-size:20px;padding:8px;color:var(--mut)}
/* lecteur */
#player{position:fixed;inset:0;z-index:100;background:#000;display:none}
#player.on{display:block}
#pv{width:100%;height:100%;background:#000;object-fit:contain}
.ptop{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 40px;background:linear-gradient(#000b,#0000);transition:opacity .3s;pointer-events:none}
.ptop>*{pointer-events:auto}
.ptop button{width:42px;height:42px;border-radius:50%;background:#0009;backdrop-filter:blur(10px);display:grid;place-items:center;font-size:21px;flex:0 0 42px}
#ptitle{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px #000}
#player.hide .ptop,#player.hide #pepg{opacity:0}
#pepg{position:absolute;left:14px;right:14px;bottom:86px;background:#000a;backdrop-filter:blur(14px);border-radius:16px;padding:12px 16px;font-size:14.5px;transition:opacity .3s;pointer-events:none}
#pepg b{display:block}#pepg small{color:#c7c7cc}
#pmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000b;padding:10px 16px;border-radius:14px;text-align:center;max-width:80%;display:none;font-size:15px}
/* divers */
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2c2c2eee;backdrop-filter:blur(12px);padding:11px 18px;border-radius:22px;z-index:200;opacity:0;transition:.3s;pointer-events:none;font-weight:600;font-size:14.5px;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--mut);padding:60px 30px}.empty .btn{display:inline-flex;margin-top:18px;flex:none;padding:13px 26px;background:var(--acc);color:#fff}
.spin{display:grid;place-items:center;padding:80px;color:var(--mut)}
.spin i{width:30px;height:30px;border:3px solid #333;border-top-color:var(--acc);border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
.grp{background:var(--card);border-radius:18px;margin:0 16px 22px;overflow:hidden}
.grp .r{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--sep);min-height:52px}.grp .r:last-child{border:0}
.grp label{flex:0 0 110px;color:#d1d1d6}
.grp input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;outline:none;text-align:right}
.gh{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.6px;padding:0 32px 8px}
.gf{color:var(--mut);font-size:13px;padding:0 32px 22px;margin-top:-14px}
.sw{display:flex;gap:12px;margin-left:auto}.sw i{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw i.on{border-color:#fff}
.sinput{margin:0 20px 18px;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:0 14px}
.sinput input{flex:1;background:none;border:0;color:#fff;font:inherit;padding:14px 0;outline:none;font-size:17px}
.sinput svg{color:var(--mut);font-size:20px}
@media(min-width:900px){.pc{flex-basis:160px}.hc b{font-size:42px}.hc .t{left:40px;bottom:34px}h1.lt{padding-left:28px}.row,.chips,.grid,h2.rt{padding-left:28px;padding-right:28px}.hero{padding:0 28px}}

/* ---------- mode TV (télécommande) ---------- */
.rc .ph{transition:transform .2s,box-shadow .2s}
.chip,.btn,#tabs button,.pill button,.xb,h2.rt button,.ep button,.dl button,.ch .st,.sw i{transition:transform .15s,background .15s,color .15s,box-shadow .15s}
html.tv *:focus{outline:none}
html.tv #tabs{top:calc(10px + env(safe-area-inset-top));bottom:auto;left:20px;transform:none;width:min(540px,62%)}
html.tv #top{padding-top:calc(16px + env(safe-area-inset-top))}
html.tv #page{padding-top:30px}
html.tv body{padding-bottom:40px}
html.tv .row{padding-top:18px;padding-bottom:18px}
html.tv .hc{aspect-ratio:2.6;max-height:420px}
html.tv .hc b{font-size:34px}
html.tv .pc{flex-basis:150px}
html.tv .card{max-width:900px}
html.tv .grid{padding-top:12px}
html.tv .pc:hover .ph{transform:none}
html.tv .pc:focus .ph,html.tv .rc:focus .ph{transform:scale(1.1);box-shadow:0 0 0 4px #fff,0 18px 40px #000c}
html.tv .pc:focus .nm,html.tv .rc:focus .nm{color:#fff;transform:translateY(12px)}
html.tv .pc .nm,html.tv .rc .nm{transition:transform .2s}
html.tv .hc:focus{outline:5px solid #fff;outline-offset:-5px}
html.tv .ch:focus{background:var(--card2);box-shadow:inset 0 0 0 3px #fff}
html.tv .chip:focus,html.tv .btn:focus,html.tv #tabs button:focus,html.tv .pill button:focus,html.tv .xb:focus,html.tv h2.rt button:focus,html.tv .ep button:focus,html.tv .dl button:focus,html.tv .ch .st:focus{background:#fff;color:#000;transform:scale(1.07)}
html.tv .ep .it:focus,html.tv .dl[data-lib]:focus,html.tv .grp .r:focus,html.tv .grp .r:focus-within{box-shadow:inset 0 0 0 3px #fff;background:#ffffff14;border-radius:12px}
html.tv .sw i:focus{transform:scale(1.25);box-shadow:0 0 0 3px #fff}
html.tv .sinput:focus-within{box-shadow:0 0 0 3px #fff}
</style></head><body>
<div id="wrap"><div id="top"><div class="pill" id="pill"></div></div><div id="page"></div></div>

<nav id="tabs"></nav>
<div id="sheet"></div>
<div id="dls"><div class="card" id="dlsc"></div></div>
<div id="player"><video id="pv" controls playsinline autoplay></video>
 <div class="ptop"><button id="pclose" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ptitle"></div>
 <button id="pprev" hidden><svg viewBox="0 0 24 24"><path class="f" d="M15 5v14l-9-7z"/></svg></button><button id="pnext" hidden><svg viewBox="0 0 24 24"><path class="f" d="M9 5v14l9-7z"/></svg></button>
 <button id="pfix" title="Corriger le son"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/></svg></button></div>
 <div id="pepg" hidden></div><div id="pmsg"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const px=(u,h)=>u?'/proxy?url='+encodeURIComponent(u)+(h?'&hls=1':''):'';
const I={
 tv:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12.5" rx="3"/><path d="M8.5 21h7M12 17.5V21"/></svg>',
 film:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M3 15h18M8 4v5M16 4v5M8 15v5M16 15v5"/></svg>',
 play:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3.5"/><path class="f" d="M10 8.7v6.6l5.4-3.3z"/></svg>',
 gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>',
 search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
 star:'<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9-4.3-4.1 5.9-.8z"/></svg>',
 starf:'<svg viewBox="0 0 24 24"><path class="f" d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9-4.3-4.1 5.9-.8z"/></svg>',
 grid:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M9.5 6h10.5M9.5 12h10.5M9.5 18h10.5"/><circle class="f" cx="4.8" cy="6" r="1.2"/><circle class="f" cx="4.8" cy="12" r="1.2"/><circle class="f" cx="4.8" cy="18" r="1.2"/></svg>',
 dl:'<svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 20h14"/></svg>',
 pl:'<svg viewBox="0 0 24 24"><path class="f" d="M7 4.5v15l12.5-7.5z"/></svg>',
 chev:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'
};
let S={},CFG={},CAT={},IDX={film:{},serie:{},live:{}},TAB='films',RT=0,heroTimer,ACTIVE=0;
const VIEW={live:{mode:'rows',fav:false,cat:''},films:{mode:'rows',fav:false,cat:''},series:{mode:'rows',fav:false,cat:''}};
const KIND={films:'film',series:'serie',live:'live'};

/* ---------- données ---------- */
let st;const save=()=>{clearTimeout(st);st=setTimeout(()=>fetch('/api/state',{method:'POST',body:JSON.stringify(S)}),700)};
const X=async(a,p={})=>{const r=await fetch('/api/x?'+new URLSearchParams({...(a?{action:a}:{}),...p}));
 const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw new Error(r.ok?'Réponse illisible du serveur IPTV':t)}
 if(!r.ok||j.error)throw new Error(j.error||'Erreur '+r.status);return j};
const clean=n=>{n=String(n||'');return n.replace(/^\s*[|\[(]?\s*[A-Z]{2,3}\s*[|\])]?\s*[-:–|]\s*/,'').replace(/\s+/g,' ').trim()||n};
const rt=s=>{const r=parseFloat(s.rating)||(+s.rating_5based*2)||0;return r>0?Math.min(10,r):0};

function norm(k,s){
 if(k==='film')return{k,id:String(s.stream_id),title:clean(s.name),poster:s.stream_icon,rating:rt(s),added:+s.added||0,cat:String(s.category_id),ext:s.container_extension||'mp4',year:yr(s)};
 if(k==='serie')return{k,id:String(s.series_id),title:clean(s.name),poster:s.cover,rating:rt(s),added:+s.last_modified||0,cat:String(s.category_id),year:yr(s),genre:s.genre,plot:s.plot,backdrop:(s.backdrop_path||[])[0]};
 return{k,id:String(s.stream_id),title:clean(s.name),logo:s.stream_icon,cat:String(s.category_id),epg:s.epg_channel_id}}
function parseM3U(t){const out=[];let m=null;
 for(const l of t.split(/\r?\n/)){
  if(l.startsWith('#EXTINF')){const a=k=>(l.match(new RegExp(k+'="([^"]*)"'))||[])[1]||'';m={name:l.slice(l.lastIndexOf(',')+1).trim()||a('tvg-name'),logo:a('tvg-logo'),group:a('group-title')||'Autres'}}
  else if(m&&l.trim()&&!l.startsWith('#')){m.url=l.trim();out.push(m);m=null}}
 return out}

  if(k==='live'&&S.m3u){const arr=parseM3U(await (await fetch(px(S.m3u))).text());const groups=[...new Set(arr.map(a=>a.group))];
   const items=arr.map((a,i)=>({k:'live',id:'m'+i,title:clean(a.name),logo:a.logo,cat:a.group,url:a.url}));IDX.live={};items.forEach(i=>IDX.live[i.id]=i);
   return CAT.live={cats:groups.map(g=>({id:g,name:g})),items}}
  throw new Error('NOCONF')}

 const [cats,arr]=await Promise.all([X(m[0]),X(m[1])]);

const fmtT=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} h ${String(m).padStart(2,'0')}`:`${m} min`};

(()=>{
 const H=document.documentElement;
 const FOC='#tabs button,#pill button,.hc,.pc,.rc,.ch,.ch .st,.chip,.btn,.xb,h2.rt button,.ep .it,.ep button,.dl[data-lib],.dl button,.grp .r[id],.grp input,.sw i,.sinput input';
 const isTV=()=>H.classList.contains('tv');
 if(/[?&]tv=1/.test(location.search)||/BoxTV|Android.*(\bTV\b|AFT|BRAVIA|MIBOX|Mi ?Box|SHIELD)|GoogleTV|SmartTV|CrKey/i.test(navigator.userAgent))H.classList.add('tv');
 // sur la télé : page calculée sur 1280 px de large puis réduite à l'écran (moins « zoomé »)
 if(isTV()&&/Android|BoxTV/i.test(navigator.userAgent)){const m=document.querySelector('meta[name=viewport]');if(m)m.content='width=1280'}
 addEventListener('touchstart',()=>H.classList.remove('tv'),{passive:true});
 const on=id=>$('#'+id).classList.contains('on');
 const root=()=>on('sheet')?$('#sheet'):on('dls')?$('#dls'):document;
 const isBar=e=>!!e.closest('#tabs,#pill');
 const vis=e=>{if(e.disabled||e.closest('[hidden]'))return false;const r=e.getBoundingClientRect();return r.width>0&&r.height>0};
 const items=()=>{const r=root();return $$(FOC,r).filter(e=>(r!==document||!e.closest('#sheet,#dls,#player'))&&vis(e))};
 const keyOf=e=>{if(e.id)return'#'+CSS.escape(e.id);const d=Object.entries(e.dataset);if(!d.length)return null;
  return d.map(([k,v])=>'[data-'+k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())+'="'+CSS.escape(v)+'"]').join('')};
 const match=(e,k)=>{try{return e.matches(k)}catch{return false}};
 let KEY=null,RESTORE=null,STACK=[],OPEN=[],pushed=0,ignore=0,raf=0;
 document.addEventListener('focusin',e=>{const k=keyOf(e.target);if(k)KEY=k});

 function focusEl(e,scroll=true){
  if(!e)return;if(!e.matches('button,input,a,[tabindex]'))e.tabIndex=-1;
  e.focus({preventScroll:true});
  if(scroll&&!isBar(e))e.scrollIntoView({block:root()===document?'center':'nearest',inline:e.classList.contains('hc')?'center':'nearest',behavior:'smooth'})}

 // remet le focus au bon endroit après un changement d'écran
 function ensure(force){
  if(!isTV()||on('player'))return;
  const a=document.activeElement,list=items();if(!list.length)return;
  if(a&&a!==document.body&&list.includes(a)){RESTORE=null;return}
  const r=root();let t=null;
  if(RESTORE&&RESTORE.el&&list.includes(RESTORE.el))t=RESTORE.el;
  else if(RESTORE&&RESTORE.key)t=list.find(e=>match(e,RESTORE.key));
  if(!t&&KEY&&!/closesheet|closedls/.test(KEY))t=list.find(e=>match(e,KEY));
  if(!t){
   if(r!==document)t=list.find(e=>e.matches('.btn.p'))||list.find(e=>!e.matches('.xb'))||list[0];
   else{const c=list.filter(e=>!isBar(e)).map(e=>[e,e.getBoundingClientRect()]).filter(([,b])=>b.bottom>0&&b.top<innerHeight).sort((x,y)=>x[1].top-y[1].top||x[1].left-y[1].left);
    if(c.length)t=c[0][0];else if(force)t=list.find(e=>e.matches('#tabs button.on'))||list[0];else return}}
  RESTORE=null;focusEl(t,false)}
 const sched=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>ensure())};

 // fermeture de la fiche / des téléchargements / du lecteur
 function closeTop(){
  if(on('player'))closePlayer();
  else if(on('sheet'))closeSheet();
  else if(on('dls')){$('#dls').classList.remove('on');document.body.style.overflow=''}}

 // suivi des fenêtres ouvertes + bouton Retour (historique)
 function layers(){
  const now=['dls','sheet','player'].filter(on);
  now.filter(x=>!OPEN.includes(x)).forEach(id=>{STACK.push({id,el:document.activeElement,key:KEY});if(id==='player'&&document.activeElement)document.activeElement.blur()});
  OPEN.filter(x=>!now.includes(x)).forEach(id=>{const i=STACK.map(s=>s.id).lastIndexOf(id);if(i>=0)RESTORE=STACK.splice(i,1)[0]});
  OPEN=now;
  while(pushed<now.length){pushed++;history.pushState({tvl:pushed},'')}
  if(pushed>now.length){const k=pushed-now.length;pushed=now.length;ignore++;history.go(-k)}
  sched()}

 new MutationObserver(layers).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});

 // choisit l'élément le plus proche dans la direction demandée
 function pick(pool,r,dir){
  const cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
  for(const e of pool){const c=e.getBoundingClientRect(),ex=c.left+c.width/2,ey=c.top+c.height/2;let s;
   const ov=dir==='left'||dir==='right'?Math.min(r.bottom,c.bottom)-Math.max(r.top,c.top):Math.min(r.right,c.right)-Math.max(r.left,c.left);
   if(dir==='right'){if(!(ex>cx+2&&c.left>r.left+2))continue;s=Math.max(0,c.left-r.right)+(ov>0?0:Math.abs(ey-cy)*3)}
   else if(dir==='left'){if(!(ex<cx-2&&c.right<r.right-2))continue;s=Math.max(0,r.left-c.right)+(ov>0?0:Math.abs(ey-cy)*3)}
   else if(dir==='down'){if(!(ey>cy+2&&c.top>r.top+2))continue;s=Math.max(0,c.top-r.bottom)+Math.abs(ex-cx)*(ov>0?.3:1)}
   else{if(!(ey<cy-2&&c.bottom<r.bottom-2))continue;s=Math.max(0,r.top-c.bottom)+Math.abs(ex-cx)*(ov>0?.3:1)}
   if(s<bs){bs=s;best=e}}
  return best}
 function move(dir){
  const list=items(),a=document.activeElement;
  if(!a||!list.includes(a)){ensure(true);return}
  const doc=root()===document,bar=isBar(a);let pool=list.filter(e=>e!==a);
  if(doc){if(bar){if(dir==='up')return;pool=pool.filter(e=>dir==='down'?!isBar(e):isBar(e))}else pool=pool.filter(e=>!isBar(e))}
  let t=pick(pool,a.getBoundingClientRect(),dir);
  if(!t&&doc&&!bar&&dir==='up')t=$('#tabs button.on')||$('#tabs button');
  if(t)focusEl(t)}

 // lecteur : avance / recul rapide
 function seek(s){
  if(!PL||PL.kind==='live')return;
  if(PL.tc){PL.off=Math.max(0,(PL.off||0)+pv.currentTime+s);pv.src='/api/transcode?url='+encodeURIComponent(PL.url)+(PL.off>5?'&ss='+Math.floor(PL.off):'');pv.play().catch(()=>{});return}
  if(isFinite(pv.duration))pv.currentTime=Math.max(0,Math.min(pv.duration-1,pv.currentTime+s))}

 const DIR={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};
 const BACK=['Escape','GoBack','BrowserBack','Back'];
 document.addEventListener('keydown',e=>{
  const k=e.key,a=document.activeElement,typing=!!a&&a.tagName==='INPUT',ok=k==='Enter'||e.keyCode===23;
  if(on('player')){
   const live=PL&&PL.kind==='live';let h=true;
   if(BACK.includes(k)||k==='Backspace')closePlayer();
   else if(ok||k===' '||k==='MediaPlayPause')pv.paused?pv.play().catch(()=>{}):pv.pause();
   else if(k==='MediaPlay')pv.play().catch(()=>{});
   else if(k==='MediaPause')pv.pause();
   else if(live&&(k==='ArrowUp'||k==='ChannelUp'))zap(-1);
   else if(live&&(k==='ArrowDown'||k==='ChannelDown'))zap(1);
   else if(k==='ArrowLeft')seek(-10);else if(k==='ArrowRight')seek(10);
   else if(k==='MediaRewind')seek(-30);else if(k==='MediaFastForward')seek(30);
   else if(!k.startsWith('Arrow'))h=false;
   if(h){e.preventDefault();e.stopPropagation();H.classList.add('tv');showUi()}
   return}
  if(DIR[k]){
   if(typing&&(k==='ArrowLeft'||k==='ArrowRight'))return;
   e.preventDefault();if(!isTV()){H.classList.add('tv');ensure();return}move(DIR[k]);return}
  if(ok){
   if(typing){e.preventDefault();move('down');return}
   if(a&&a.matches(FOC)&&!a.matches('button,input,a')){e.preventDefault();a.click()}
   return}
  if(BACK.includes(k)||(k==='Backspace'&&!typing)){
   if(on('sheet')||on('dls')){e.preventDefault();closeTop();return}
   if(isTV()&&a&&a.matches(FOC)&&!isBar(a)){e.preventDefault();focusEl($('#tabs button.on')||$('#tabs button'),false)}}
 },true);
 if(isTV())setTimeout(ensure,800);
})();
